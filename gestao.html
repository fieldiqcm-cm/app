<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldIQ Gestão</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('fiq-tema-g')||'claro';if(t!=='auto')document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<meta name="theme-color" content="#E8E0D3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="FieldIQ">
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/playfair-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:600;font-display:swap;src:url(assets/fonts/playfair-display-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/mulish-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/mulish-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/mulish-latin-800-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: app de gestão do analista, um telemóvel ao centro; tema claro (beje + cobre) para nunca se confundir com a app do cliente; vistas trocadas por #hash. */
:root{
  --bg:#D9D0C1; --app:#E8E0D3; --card:#F6F2E9; --line:#D3C8B6; --line2:#C2B6A2;
  --fg:#1B1815; --muted:#4F473E; --dim:#6E6457;
  --cobre:#8A4F24; --cobre2:#B5703E; --ink:#1B1815; --gold:#C9A453; --gold2:#E2C27A;
  --on-ink:#F2EEE2; --on-ink-muted:#CFC4B3; --field:#FFFFFF; --soft:var(--soft); --nav:#EFE8DC;
  --ok:#2F6B45; --warn:#9A5B12; --bad:#A33A2C; --ok-bg:#DCEADF; --warn-bg:#F3E2C6; --bad-bg:#F3D6D0; --on-cobre:#FFFFFF; --on-bad:#FFFFFF;
  --display:'Playfair Display', Georgia, serif; --body:Mulish, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark;
}
#vista,.card,nav.tabs,.phone{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--cobre)}
:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
[hidden]{display:none!important}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100%;height:100%;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:600px) and (max-width:899px){
  .stage{padding-block:32px}
  .phone{min-height:860px;height:860px;border-radius:40px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(60,40,20,.35),0 0 0 8px #2A2723}
}
#vista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:20px 24px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));animation:entra .3s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.marca .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
.marca .em span,.marca b{color:var(--cobre2)}
.tag{font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:1.6px;background:var(--ink);color:var(--gold2);border-radius:99px;padding:4px 8px;text-transform:uppercase}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--cobre);text-transform:uppercase}
h1{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--cobre)}
h2{margin:0;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:block;color:var(--fg);text-decoration:none}
.dark{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:16px;display:block;text-decoration:none}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.dark.kpi span{color:var(--on-ink-muted)}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-ink{background:var(--ink);color:var(--gold2)}
.p-soft{background:var(--soft);color:var(--muted)}
.btn{min-height:48px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;border:none;width:100%;padding:0 16px}
.btn.ink{background:var(--ink);color:var(--gold2)}
.btn.cobre{background:var(--cobre);color:var(--on-cobre)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{min-height:40px;width:auto;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;cursor:pointer;position:relative;flex-shrink:0}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.input{color:var(--fg);min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--field);padding:0 14px;width:100%}
textarea.input{padding:12px 14px;resize:none;line-height:1.4}
label.l{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.6px}
.campo{display:flex;flex-direction:column;gap:6px}
.lista{display:flex;flex-direction:column;gap:8px}
.cli{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av{width:42px;height:42px;border-radius:21px;background:var(--ink);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.cli .nm{font-weight:800}
.cli .ds{font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:9px;height:9px;border-radius:5px;background:var(--bad);flex-shrink:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold2)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--field);font-size:20px;font-weight:800;cursor:pointer}
.step b{font-family:var(--display);font-size:26px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.an{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.up{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px dashed var(--line2);cursor:pointer;font-size:13px;font-weight:700;background:var(--card)}
.up.feito{border-style:solid;border-color:var(--ok);color:var(--ok)}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.it{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;border-radius:10px;background:var(--field);border:1px solid var(--line);font-size:14px}
.it span{flex:1}
.it button{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--dim);font-size:18px}
.msg{max-width:86%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45}
.msg small{display:block;font-size:11px;margin-top:6px;opacity:.7}
.msg .sb{display:block;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.msg.cli2{align-self:flex-start;background:var(--field);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.eu{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.lock{font-size:13px;color:var(--dim);border:1px dashed var(--line2);border-radius:12px;padding:12px}
nav.tabs{flex-shrink:0;border-top:1px solid var(--line2);background:var(--nav);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:max(8px, env(safe-area-inset-bottom,0px))}
nav.tabs a{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:800;position:relative}
nav.tabs a[aria-current="page"]{color:var(--cobre)}
nav.tabs .badge{top:6px;right:calc(50% - 22px)}
.push{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(27,24,21,.96);color:#F2EEE2;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9;cursor:pointer;animation:desce .4s cubic-bezier(.2,1.3,.4,1);border:none;text-align:left;width:auto;font:inherit}
@keyframes desce{from{transform:translateY(-120%)}to{transform:none}}
.push .ic{width:36px;height:36px;border-radius:9px;background:var(--ink);border:1px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0}
.push small{display:block;font-size:11px;color:#CFC4B3}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--gold2);font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;z-index:8;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.side-brand{display:none}
@media (min-width:900px){
  .stage{height:100%;padding:0}
  .phone{max-width:none;height:100%;min-height:0;border-radius:0;border:none;box-shadow:none;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-top:0}
  #vista{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;align-items:start;gap:16px;padding:40px max(48px, calc((100% - 1120px) / 2)) 48px}
  .phone:has(#tabs:not([hidden])) #vista{grid-column:2}
  #vista > *{grid-column:1 / -1}
  #vista > .card{grid-column:auto}
  .phone:has(#tabs:not([hidden])) #vista > .top .marca{display:none}
  #vista > .top{justify-content:flex-end}
  #vista:has(#g-login) > .top{justify-content:space-between}
  #vista > .top > .iconbtn{margin-left:auto}
  #vista > .btn.small{justify-self:start}
  nav.tabs{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:4px;border-top:none;border-right:1px solid var(--line2);padding:28px 14px}
  nav.tabs a{flex-direction:row;justify-content:flex-start;height:48px;padding:0 14px;gap:12px;font-size:14px;border-radius:12px}
  nav.tabs a:hover{background:var(--soft);color:var(--fg)}
  nav.tabs a[aria-current="page"]{background:var(--card)}
  nav.tabs .badge{position:static;margin-left:auto}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--display);font-weight:700;font-size:19px}
  .side-brand .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
  .side-brand .em span,.side-brand b{color:var(--cobre2)}
  h1{font-size:34px}
  #vista .grid2{grid-template-columns:repeat(4,minmax(0,1fr))}
  #vista .card .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #lista-cli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .msg{max-width:min(86%,640px)}
  .push{left:auto;right:24px;width:380px}
  .toast{bottom:32px}
  #vista:has(#g-login){grid-template-columns:minmax(0,440px);justify-content:center;align-content:center}
}
.vl{font-size:12px;font-weight:700;min-height:16px}
.vl.ok{color:var(--ok)}
.vl.ok::before{content:"✓ "}
.vl.bad{color:var(--bad)}
.vl.bad::before{content:"✕ "}
.dica{font-size:13px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dica summary{font-weight:800;cursor:pointer;min-height:28px;display:flex;align-items:center}
.dica ol{margin:6px 0 0;padding-left:20px;line-height:1.6}
.tema-btn .ico-sol{display:none}.tema-btn.escuro .ico-sol{display:block}.tema-btn.escuro .ico-lua{display:none}
.nav-tema{display:none}
.resumo{display:flex;flex-wrap:wrap;gap:6px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;position:sticky;top:-20px;z-index:2;background:var(--app);margin:0 -4px;padding:6px 4px}
.secnav button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font:800 12px var(--body);cursor:pointer;white-space:nowrap}
.secnav button:hover{border-color:var(--cobre)}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:60px}
.sep{height:1px;background:var(--line);margin:4px 0}
.pfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pfg div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pfg span{display:block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.pfg b{display:block;font-size:15px;margin-top:2px}
.pfg .larga{grid-column:1 / -1}
details.an{padding:0;gap:0}
details.an > summary{list-style:none;cursor:pointer;padding:14px;min-height:48px}
details.an > summary::-webkit-details-marker{display:none}
details.an[open] > summary{border-bottom:1px solid var(--line)}
.an-corpo{display:flex;flex-direction:column;gap:10px;padding:14px}
@media (min-width:900px){ .nav-tema{display:flex;align-items:center;gap:12px;margin-top:auto;order:99;height:48px;padding:0 14px;border:none;border-radius:12px;background:none;color:var(--dim);font:800 14px var(--body);cursor:pointer} .nav-tema:hover{background:var(--soft);color:var(--fg)} .secnav{top:-40px} }
.secnav button[aria-selected="true"]{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.secnav .tab-n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--cobre);color:var(--on-cobre);font-size:10px}
.secnav button[aria-selected="true"] .tab-n{background:var(--gold2);color:var(--ink)}
.secnav .ver-como{margin-left:auto;background:transparent;border-style:dashed}
.sec{animation:entra .25s ease-out}
@media (min-width:900px){ #vista > .sec{grid-column:1 / -1} .sec{max-width:820px} }
.btn.whats{background:#1F7A4D;color:#fff}
.ok-g{width:84px;height:84px;border-radius:42px;background:var(--ink);color:var(--gold2);font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;align-self:center;margin:12px auto 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.ses-tab{display:flex;flex-direction:column;gap:6px}
.ses-row{display:flex;align-items:center;gap:8px;width:100%;min-height:54px;padding:8px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line);color:var(--fg);cursor:pointer;text-align:left;font:inherit;flex-wrap:wrap}
.ses-row:hover{border-color:var(--cobre)}
.ses-n{flex:1;min-width:140px;font-weight:800;font-size:14px}.ses-n small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.ses-v{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.note{font-size:12px;color:var(--dim);line-height:1.5}
.demo{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
<div class="phone">
  <main id="vista" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Navegação da gestão" hidden>
    <div class="side-brand"><span class="em">F<span>iQ</span></span><span>Field<b>IQ</b></span><span class="tag">Gestão</span></div>
    <a href="#painel" data-t="painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</a>

    if(t.id==='g-bio'){ logado=true; try{ sessionStorage.setItem('fiq-gestao','1'); }catch(x){} location.hash='painel'; render(); return; }
    if(t.dataset.annv && c){ var pa=t.dataset.annv.split('|'); V.querySelectorAll('[data-annv^="'+pa[0]+'|"]').forEach(function(x){ x.setAttribute('aria-pressed', x===t?'true':'false'); }); var pr=document.getElementById('pr-'+pa[0]); var ag=document.getElementById('pg-'+pa[0]); if(pr && ag && ag.value!=='Oferta') pr.value=PRECO[pa[1]]; return; }
    if(t.dataset.pack && c){ c.pack=t.dataset.pack; toast('Nível do pack alterado para '+c.pack+'.'); render(); return; }
    if(t.dataset.formato && c){ c.formato=t.dataset.formato; if(c.formato==='Pack 4' && c.total<4) c.total=4; if(c.formato==='Individual'){ c.total=Math.max(1,c.feitas||1); c.analises.forEach(function(a){ if(!a.nivel){ a.nivel=c.pack; a.preco=PRECO[c.pack]; a.pago=0; a.pagoInfo='Por pagar'; } }); } render(); return; }
    if(t.dataset.ses && c){ var k=t.dataset.ses.split(':'), d=+k[1];
      if(k[0]==='feitas') c.feitas=Math.min(c.total, Math.max(0,c.feitas+d)); else c.total=Math.max(Math.max(1,c.feitas), c.total+d);
      render(); return; }
    if(t.dataset.rm && c){ var r=t.dataset.rm.split(':'); c[r[0]].splice(+r[1],1); render(); return; }
    if(t.dataset.np){ novoPack=t.dataset.np; document.querySelectorAll('[data-np]').forEach(function(x){x.setAttribute('aria-pressed',x===t);}); atualizaPreco(); return; }
    if(t.dataset.nf){ novoForm=t.dataset.nf; document.querySelectorAll('[data-nf]').forEach(function(x){x.setAttribute('aria-pressed',x===t);}); atualizaPreco(); return; }
    if(t.dataset.guardar!==undefined && c){ var gi=+t.dataset.guardar, an=c.analises[gi], erros=[];
      ['yt','dl','pdf'].forEach(function(k){ var v=document.getElementById(k+'-'+gi).value.trim(); if(v && validaLink(k,v)[0]==='bad') erros.push(k); else an[k]=v; });
      an.ate=document.getElementById('ate-'+gi).value;
      if(!ePack(c)){ var nvb=V.querySelector('[data-annv^="'+gi+'|"][aria-pressed="true"]'); an.nivel=nvb?nvb.dataset.annv.split('|')[1]:(an.nivel||'Pro');
        an.pagoInfo=document.getElementById('pg-'+gi).value; an.preco=an.pagoInfo==='Oferta'?0:(+document.getElementById('pr-'+gi).value||0); an.pago=an.pagoInfo.indexOf('Pago')===0?an.preco:0; }
      an.nome=document.getElementById('nm-'+gi).value.trim(); an.jogo=document.getElementById('jg-'+gi).value.trim(); an.data=document.getElementById('dt-'+gi).value.trim();
      if(erros.length){ toast('Há um link que não foi reconhecido. Corrige e volta a guardar.'); return; }
      guardarDemo(c,an); toast('Guardado. O cliente recebe um aviso.'); render(); return; }
    var a=t.dataset.acao;
    if(a==='sair'){ try{ sessionStorage.removeItem('fiq-gestao'); }catch(x){} logado=false; if(/github\.io$|fieldiqcm\.com$/.test(location.hostname)) location.href='index.html'; else { location.hash='login'; render(); } return; }
    if(a==='ver-como') toast('Abre a app tal como '+nomeDe(c)+' a vê.');
    if(a==='copiar-convite'){ var cc=cli(location.hash.slice(9)); var tx=textoConvite(cc); var ok=function(){ toast('Mensagem copiada'); }; try{ navigator.clipboard.writeText(tx).then(ok,function(){ selTexto(); }); }catch(x){ selTexto(); } return; }
    if(a==='reenviar') toast('Email de ativação reenviado para '+c.email);
    if(a==='suspender') toast('Esboço: aqui suspendes o acesso (pede confirmação).');
    if(a==='guardar-stats'){ document.querySelectorAll('[data-stat]').forEach(function(i){ c.stats[i.dataset.stat]=i.value; }); toast('Estatísticas guardadas. O cliente já as vê.'); }
    if(a==='nova-analise'){ var nvN=nivelAtual(c); c.analises.unshift({id:'a'+Date.now().toString(36),nome:'Sessão '+(c.analises.length+1)+' · '+nomeCurto(c),jogo:'',data:'',estado:'Recebido',nivel:nvN,preco:ePack(c)?0:PRECO[nvN],pago:0,pagoInfo:'Por pagar',yt:'',dl:'',pdf:'',ate:''}); secAtual='sec-analises'; toast('Análise criada. Confirma o nome, o jogo e cola os links.'); render(); }
  });
  function selTexto(){ var el=document.getElementById('convite-txt'); if(!el) return; var r=document.createRange(); r.selectNodeContents(el); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Texto selecionado: copia com Ctrl+C'); }
  function atualizaPreco(){
    var tabela={Performance:[45,160],Pro:[70,250],Elite:[110,400]};
    var el=document.getElementById('n-preco'); if(el) el.value=tabela[novoPack][novoForm==='Pack 4'?1:0];
  }
  V.addEventListener('change', function(e){
    var t=e.target, c=clienteAtual();
    if(t.dataset.estado!==undefined && c){ c.analises[+t.dataset.estado].estado=t.value; toast('Estado: '+t.value+'. O cliente recebe um aviso.'); }

    if(t.id==='n-menor'){ document.getElementById('n-email-l').textContent=t.checked?'Email do encarregado de educação':'Email do jogador'; }
  });
  V.addEventListener('input', function(e){
    if(e.target.dataset && e.target.dataset.lk){ var k=e.target.dataset.lk, r=validaLink(k.split(':')[0], e.target.value), el=V.querySelector('[data-vl="'+k+'"]'); if(el){ el.className='vl '+r[0]; el.textContent=r[1]; } }
    if(e.target.id==='procura'){ var q=e.target.value.trim().toLowerCase(); document.querySelectorAll('#lista-cli [data-nome]').forEach(function(a){ a.hidden=q && a.dataset.nome.indexOf(q)<0; }); }
  });
  V.addEventListener('submit', function(e){
    e.preventDefault(); var f=e.target, c=clienteAtual();
    if(f.id==='g-login'){ logado=true; try{ sessionStorage.setItem('fiq-gestao','1'); }catch(x){} location.hash='painel'; render(); return; }
    if(f.id==='f-pag' && c){ var v=+document.getElementById('pag-v').value; if(v>0){ c.pagamentos.push({d:hoje,v:v,m:document.getElementById('pag-m').value}); toast('Pagamento de '+v+' € registado.'); render(); } return; }
    if(f.dataset.comp && c){ var tt=document.getElementById('comp-n').value.trim(), yl=document.getElementById('comp-yt').value.trim();
      if(!ytId(yl)){ toast('Cola um link do YouTube válido.'); return; }
      c.comp.unshift({n:tt||'Vídeo complementar',d:hoje,yt:yl}); toast('Vídeo adicionado. O cliente recebe um aviso.'); render(); return; }
    if(f.dataset.add && c){ var inp=f.querySelector('input'), tx=inp.value.trim(); if(tx){ c[f.dataset.add].push(tx); toast('Ponto adicionado ao plano da semana.'); render(); } return; }
    if(f.id==='f-resp'){ var i=+location.hash.slice(10), tx2=document.getElementById('resp').value.trim(); if(!tx2) return;
      var agora=new Date(), hh=String(agora.getHours()).padStart(2,'0')+'h'+String(agora.getMinutes()).padStart(2,'0');
      conversas[i].msgs.push({de:'eu',sb:'Tu',t:tx2,q:'Hoje, '+hh}); toast('Resposta enviada. O cliente recebe um aviso.'); render(); return; }
    if(f.id==='f-novo'){ var em=document.getElementById('n-email').value.trim().toLowerCase(); if(!em||em.indexOf('@')<1){ toast('Escreve um email válido.'); return; }
      var id='c'+Date.now().toString(36);
      clientes.unshift({id:id,nome:'',ini:'',pos:'',email:em,tel:document.getElementById('n-tel').value.trim(),pack:novoPack,formato:novoForm,feitas:0,total:novoForm==='Pack 4'?4:1,preco:+document.getElementById('n-preco').value||0,pagamentos:[],acesso:'Ainda não ativou a conta',perfil:null,analises:[],manter:[],melhorar:[],comp:[],stats:{passes:'',duelos:'',rec:'',dec:''}});
      var nc=cli(id); if(novoForm!=='Pack 4'){ nc.analises.push({id:'a'+Date.now().toString(36),nome:'Sessão 1 · '+nomeCurto(nc),jogo:'',data:'',estado:'Recebido',nivel:novoPack,preco:nc.preco,pago:0,pagoInfo:'Por pagar',yt:'',dl:'',pdf:'',ate:''}); }
      location.hash='convite-'+id; return; }
  });

  document.querySelector('.nav-tema').addEventListener('click', function(){ aplicaTemaG(temaEfetivoG()==='dark'?'claro':'escuro'); });
  aplicaTemaG(temaPrefG());
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
