<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldIQ Gestão</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('fiq-tema-g')||'claro';if(t!=='auto')document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<meta name="theme-color" content="#E8E0D3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FieldIQ">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/fiq-config.js"></script>
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/playfair-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:600;font-display:swap;src:url(assets/fonts/playfair-display-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/mulish-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/mulish-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/mulish-latin-800-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: app de gestão do analista, um telemóvel ao centro; tema claro (beje + cobre) para nunca se confundir com a app do cliente; vistas trocadas por #hash. */
:root{
  --bg:#D9D0C1; --app:#E8E0D3; --card:#F6F2E9; --line:#D3C8B6; --line2:#C2B6A2;
  --fg:#1B1815; --muted:#4F473E; --dim:#6E6457;
  --cobre:#8A4F24; --cobre2:#B5703E; --ink:#1B1815; --gold:#C9A453; --gold2:#E2C27A;
  --on-ink:#F2EEE2; --on-ink-muted:#CFC4B3; --field:#FFFFFF; --soft:var(--soft); --nav:#EFE8DC;
  --ok:#2F6B45; --warn:#9A5B12; --bad:#A33A2C; --ok-bg:#DCEADF; --warn-bg:#F3E2C6; --bad-bg:#F3D6D0; --on-cobre:#FFFFFF; --on-bad:#FFFFFF;
  --display:'Playfair Display', Georgia, serif; --body:Mulish, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark;
}
#vista,.card,nav.tabs,.phone{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--cobre)}
:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
[hidden]{display:none!important}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100%;height:100%;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:600px) and (max-width:899px){
  .stage{padding-block:32px}
  .phone{min-height:860px;height:860px;border-radius:40px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(60,40,20,.35),0 0 0 8px #2A2723}
}
#vista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:20px 24px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));animation:entra .3s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.marca .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
.marca .em span{color:var(--cobre2)}
.wm{font-family:var(--display);font-weight:700;letter-spacing:0;white-space:nowrap}
.wm b{font-weight:700;color:#A98638}
:root[data-theme="dark"] .wm b{color:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wm b{color:var(--gold)} }
.em-img{width:34px;height:34px;border-radius:17px;display:block;flex-shrink:0}
.tag{font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:1.6px;background:var(--ink);color:var(--gold2);border-radius:99px;padding:4px 8px;text-transform:uppercase}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--cobre);text-transform:uppercase}
h1{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--cobre);font-variant-numeric:lining-nums}
h2{margin:0;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:block;color:var(--fg);text-decoration:none}
.dark{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:16px;display:block;text-decoration:none}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.dark.kpi span{color:var(--on-ink-muted)}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-ink{background:var(--ink);color:var(--gold2)}
.p-soft{background:var(--soft);color:var(--muted)}
.btn{min-height:48px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;border:none;width:100%;padding:0 16px}
.btn.ink{background:var(--ink);color:var(--gold2)}
.btn.cobre{background:var(--cobre);color:var(--on-cobre)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{min-height:40px;width:auto;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;cursor:pointer;position:relative;flex-shrink:0}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.input{color:var(--fg);min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--field);padding:0 14px;width:100%}
textarea.input{padding:12px 14px;resize:none;line-height:1.4}
label.l{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.6px}
.campo{display:flex;flex-direction:column;gap:6px}
.lista{display:flex;flex-direction:column;gap:8px}
.cli{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden;width:42px;height:42px;border-radius:21px;background:var(--ink);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.cli .nm{font-weight:800}
.cli .ds{font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:9px;height:9px;border-radius:5px;background:var(--bad);flex-shrink:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold2)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--field);font-size:20px;font-weight:800;cursor:pointer}
.step b{font-family:var(--display);font-size:26px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.an{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.up{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px dashed var(--line2);cursor:pointer;font-size:13px;font-weight:700;background:var(--card)}
.up.feito{border-style:solid;border-color:var(--ok);color:var(--ok)}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.it{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;border-radius:10px;background:var(--field);border:1px solid var(--line);font-size:14px}
.it span{flex:1}
.it button{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--dim);font-size:18px}
.msg{max-width:86%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45}
.msg small{display:block;font-size:11px;margin-top:6px;opacity:.7}
.msg .sb{display:block;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.msg.cli2{align-self:flex-start;background:var(--field);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.eu{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.lock{font-size:13px;color:var(--dim);border:1px dashed var(--line2);border-radius:12px;padding:12px}
nav.tabs{flex-shrink:0;border-top:1px solid var(--line2);background:var(--nav);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:max(8px, env(safe-area-inset-bottom,0px))}
nav.tabs a{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:800;position:relative}
nav.tabs a[aria-current="page"]{color:var(--cobre)}
nav.tabs .badge{top:6px;right:calc(50% - 22px)}
.push{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(27,24,21,.96);color:#F2EEE2;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9;cursor:pointer;animation:desce .4s cubic-bezier(.2,1.3,.4,1);border:none;text-align:left;width:auto;font:inherit}
@keyframes desce{from{transform:translateY(-120%)}to{transform:none}}
.push .ic{width:36px;height:36px;border-radius:9px;background:var(--ink);border:1px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0}
.push small{display:block;font-size:11px;color:#CFC4B3}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--gold2);font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;z-index:8;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.side-brand{display:none}
@media (min-width:900px){
  .stage{height:100%;padding:0}
  .phone{max-width:none;height:100%;min-height:0;border-radius:0;border:none;box-shadow:none;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-top:0}
  #vista{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;align-items:start;gap:16px;padding:40px max(48px, calc((100% - 1120px) / 2)) 48px}
  .phone:has(#tabs:not([hidden])) #vista{grid-column:2}
  #vista > *{grid-column:1 / -1}
  #vista > .card{grid-column:auto}
  .phone:has(#tabs:not([hidden])) #vista > .top .marca{display:none}
  #vista > .top{justify-content:flex-end}
  #vista:has(#g-login) > .top{justify-content:space-between}
  #vista > .top > .iconbtn{margin-left:auto}
  #vista > .btn.small{justify-self:start}
  nav.tabs{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:4px;border-top:none;border-right:1px solid var(--line2);padding:28px 14px}
  nav.tabs a{flex-direction:row;justify-content:flex-start;height:48px;padding:0 14px;gap:12px;font-size:14px;border-radius:12px}
  nav.tabs a:hover{background:var(--soft);color:var(--fg)}
  nav.tabs a[aria-current="page"]{background:var(--card)}
  nav.tabs .badge{position:static;margin-left:auto}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--display);font-weight:700;font-size:19px}
  .side-brand .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
  .side-brand .em span{color:var(--cobre2)}
  h1{font-size:34px}
  #vista .grid2{grid-template-columns:repeat(4,minmax(0,1fr))}
  #vista .card .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #lista-cli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .msg{max-width:min(86%,640px)}
  .push{left:auto;right:24px;width:380px}
  .toast{bottom:32px}
  #vista:has(#g-login){grid-template-columns:minmax(0,440px);justify-content:center;align-content:center}
}
.vl{font-size:12px;font-weight:700;min-height:16px}
.vl.ok{color:var(--ok)}
.vl.ok::before{content:"✓ "}
.vl.bad{color:var(--bad)}
.vl.bad::before{content:"✕ "}
.dica{font-size:13px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dica summary{font-weight:800;cursor:pointer;min-height:28px;display:flex;align-items:center}
.dica ol{margin:6px 0 0;padding-left:20px;line-height:1.6}
.tema-btn .ico-sol{display:none}.tema-btn.escuro .ico-sol{display:block}.tema-btn.escuro .ico-lua{display:none}
.nav-tema{display:none}
.resumo{display:flex;flex-wrap:wrap;gap:6px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;position:sticky;top:-20px;z-index:2;background:var(--app);margin:0 -4px;padding:6px 4px}
.secnav button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font:800 12px var(--body);cursor:pointer;white-space:nowrap}
.secnav button:hover{border-color:var(--cobre)}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:60px}
.sep{height:1px;background:var(--line);margin:4px 0}
.pfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pfg div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pfg span{display:block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.pfg b{display:block;font-size:15px;margin-top:2px}
.pfg .larga{grid-column:1 / -1}
details.an{padding:0;gap:0}
details.an > summary{list-style:none;cursor:pointer;padding:14px;min-height:48px}
details.an > summary::-webkit-details-marker{display:none}
details.an[open] > summary{border-bottom:1px solid var(--line)}
.an-corpo{display:flex;flex-direction:column;gap:10px;padding:14px}
.gd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}.gd-row .btn{width:100%;white-space:nowrap}@media (max-width:440px){.gd-row .gd-cli{display:none}}
.pdf-it,.pdf-up{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2,#CFC4B3);border-radius:12px;flex-wrap:wrap}
.pdf-up{border-style:dashed;cursor:pointer}
.pdf-up:hover{border-color:var(--cobre,#8A4F24)}
.pdf-ic{width:38px;height:44px;border-radius:6px;background:#8A4F24;color:#fff;font:800 11px/44px Mulish,sans-serif;text-align:center;flex:none;letter-spacing:.5px}
.nt-box{border:1px solid var(--line2,#CFC4B3);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nt-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nt-tit{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--cobre,#8A4F24);margin:2px 0 6px}
.nt-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
.nt-row .input{height:40px;padding:0 10px;text-align:center;font-weight:800}
.nt-aviso{background:rgba(201,164,83,.14);border-radius:12px;gap:10px;flex-wrap:wrap}
.textlink{background:none;border:0;color:var(--cobre,#8A4F24);font-weight:800;cursor:pointer;font-size:12px;padding:0}
.atr-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.atr-cols .input{margin-bottom:8px}
.atr-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.atr-row .atr-val{text-align:center;font-weight:800}
.etq button.atr-on{background:var(--ink,#1B1815);color:var(--gold2,#E2C27A);border-color:var(--ink,#1B1815)}
.atr-cols .input.foco{outline:2px solid var(--cobre,#8A4F24)}
.etq{display:flex;flex-wrap:wrap;gap:6px}
.etq button{border:1px solid var(--line2,#CFC4B3);background:var(--card,#fff);color:inherit;border-radius:99px;padding:6px 11px;font:700 12px var(--body,sans-serif);cursor:pointer}
.etq button:hover{border-color:var(--cobre,#8A4F24)}
.etq button.usada{opacity:.4}
@media (max-width:640px){ .nt-cols,.atr-cols{grid-template-columns:1fr} }
.mo-box{border:1px dashed var(--line2,#CFC4B3);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mo-row{display:grid;grid-template-columns:84px 124px minmax(0,1fr) 32px;gap:6px;align-items:center}
.mo-row .input{height:40px;padding:0 10px;font-size:14px}
.mo-row .mo-d{grid-column:3 / 4}
.mo-row + .mo-row{border-top:1px solid var(--line2,#CFC4B3);padding-top:8px}
.mo-x{background:none;border:0;font-size:20px;cursor:pointer;color:inherit;opacity:.6}
@media (max-width:640px){ .mo-row{grid-template-columns:76px minmax(0,1fr) 32px} .mo-row .mo-a,.mo-row .mo-d{grid-column:1 / -1} }

<script>

      analises:[{id:'sn',notas:[['Receção orientada',80],['Condução de bola',70],['Diversidade de passe / verticalização',85],['Afundar / criar distâncias',70],['Controlo de profundidade',75],['Duelos defensivos',75],['Fecho de baliza',75],['Equilíbrio defensivo',80]],nome:'Sessão 1 · Rui S.',jogo:'vs. Sporting Norte',data:'2 nov',estado:'Concluída',nivel:'Elite',preco:110,pago:110,pagoInfo:'Pago · Multibanco',yt:'',dl:'https://transfer.it/t/exemplo',pdf:'https://transfer.it/t/exemplo',ate:''},{id:'ro',nome:'Sessão 1 · Rui S.',jogo:'vs. Oriental',data:'19 out',estado:'Concluída',nivel:'Pro',preco:70,pago:70,pagoInfo:'Pago · MB WAY',yt:'',dl:'',pdf:'',ate:''}],
      manter:['Controlo da profundidade'], melhorar:['Primeiro passe a romper linhas'], comp:[], stats:{passes:'88%',duelos:'9/12',rec:'11',dec:'81'}},
    {id:'bruno', nome:'Bruno L.', ini:'BL', pos:'Extremo', menor:true, email:'bruno@exemplo.pt', pack:'Performance', formato:'Individual', feitas:0, total:1, preco:45, pagamentos:[], acesso:'Ainda não ativou a conta',
      analises:[{id:'lf',nome:'Sessão 1 · Bruno L.',jogo:'vs. Leões FC',data:'8 nov',estado:'Recebido',nivel:'Performance',preco:45,pago:0,pagoInfo:'Por pagar',yt:'',dl:'',pdf:'',ate:''}], manter:[], melhorar:[], comp:[], stats:{passes:'',duelos:'',rec:'',dec:''}}
  ];
  // Exemplo: uma só análise por jogador. O que já foi guardado neste aparelho volta a aparecer na gestão.
  (function(){
    var o={}; try{ o=JSON.parse(localStorage.getItem('fiq-demo-links')||'{}'); }catch(e){}
    clientes.forEach(function(c){
      try{ var oa=JSON.parse(localStorage.getItem('fiq-demo-atr')||'{}'); if(oa[c.id]) c.atr=oa[c.id]; }catch(e){}
      c.analises.forEach(function(a){ var p=o[c.id+'|'+a.id]; if(p){ ['notas','estado','yt','dl','ate','nome','jogo','data','pdfNome','pdfTam','momentos'].forEach(function(k){ if(p[k]!==undefined) a[k]=p[k]; }); a._guardada=true; } });
      var guardadas=c.analises.filter(function(a){ return a._guardada; });
      c.analises=[guardadas[0] || c.analises[c.id==='tiago'?1:0]];
    });
  })();
  var conversas = [
    {cli:'tiago', jogo:'vs. União Norte', lida:false, msgs:[
      {de:'cli', sb:'Vídeo · lance 07', t:'No lance 07 devia ter passado por dentro em vez de abrir na ala?', q:'27 out, 21h10'},

    {cli:'rui', jogo:'vs. Sporting Norte', lida:true, msgs:[
      {de:'cli', sb:'Relatório', t:'Na página 6, o controlo da profundidade conta só quando a equipa está a defender baixo?', q:'4 nov, 19h02'},
      {de:'eu', sb:'Tu', t:'Não, conta também com o bloco alto. Mostro-te dois exemplos na próxima sessão.', q:'5 nov, 08h50'}]}
  ];
  // Dúvidas: as mensagens novas (do jogador e as tuas respostas) passam pela "ponte" do aparelho até haver servidor
  conversas.forEach(function(v){ v.base=v.msgs.slice(); });
  function lerDuv(){ try{ return JSON.parse(localStorage.getItem('fiq-demo-duvidas')||'{}'); }catch(e){ return {}; } }
  function gravaDuv(o){ try{ localStorage.setItem('fiq-demo-duvidas', JSON.stringify(o)); }catch(e){} }
  function syncDuvidas(){
    var o=lerDuv();
    Object.keys(o).forEach(function(id){
      var v=conversas.filter(function(x){ return x.cli===id; })[0];
      if(!v){ v={cli:id, jogo:'Dúvidas', lida:false, msgs:[], base:[]}; conversas.push(v); }
      v.msgs=v.base.concat(o[id]||[]);
    });
  }
  window.addEventListener('storage', function(e){
    if(e.key!=='fiq-demo-duvidas') return;
    var antes=porResponder().length; syncDuvidas(); render();
    if(porResponder().length>antes){ var v=porResponder()[0], c=cli(v.cli); toast('Nova dúvida de '+(c?nomeDe(c):'um cliente')+'.'); }
  });
  var ESTADOS = ['Recebido','Em análise','Pronto','Sessão marcada','Concluída'];
  var POSICOES = ['Defesa central','Lateral','Médio','Interior','Extremo','Avançado'];

  // ===== utilidades =====
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function cli(id){ for (var i=0;i<clientes.length;i++) if (clientes[i].id===id) return clientes[i]; }
  var PRECO={Performance:45,Pro:70,Elite:110};
  function ePack(c){ return c.formato==='Pack 4'; }
  function valor(c){ return ePack(c) ? c.preco : c.analises.reduce(function(t,a){ return t+(+a.preco||0); },0); }
  function pago(c){ return ePack(c) ? c.pagamentos.reduce(function(a,p){ return a+p.v; },0) : c.analises.reduce(function(t,a){ return t+(+a.pago||0); },0); }
  function falta(c){ return Math.max(0, valor(c) - pago(c)); }
  function estPag(c){ var p=pago(c), v=valor(c); return p>=v ? ['Pago','p-ok'] : (p>0 ? ['Parcial','p-warn'] : ['Por pagar','p-bad']); }
  function nivelAtual(c){ if(ePack(c)) return c.pack; var a=c.analises[0]; return (a&&a.nivel)||c.pack; }
  function porResponder(){ return conversas.filter(function(v){ return v.msgs[v.msgs.length-1].de==='cli'; }); }
  var tT, tEl=document.getElementById('toast');
  function toast(m){ tEl.textContent=m; tEl.hidden=false; clearTimeout(tT); tT=setTimeout(function(){ tEl.hidden=true; },2600); }
  function ytId(u){ var m=String(u||'').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/); return m?m[1]:''; }
  var HOSTS={'wetransfer.com':'WeTransfer','we.tl':'WeTransfer','transfer.it':'transfer.it','drive.google.com':'Google Drive','docs.google.com':'Google Drive','mega.nz':'MEGA','dropbox.com':'Dropbox'};
  function servico(u){ try{ var x=new URL(u); if(x.protocol!=='https:') return ''; var h=x.hostname.replace(/^www\./,''); for(var k in HOSTS){ if(h===k||h.slice(-k.length-1)==='.'+k) return HOSTS[k]; } }catch(e){} return ''; }
  function validaLink(tipo,v){ v=v.trim(); if(!v) return ['','']; if(tipo==='yt') return ytId(v)?['ok','Vídeo do YouTube reconhecido']:['bad','Não parece um link do YouTube']; var sv=servico(v); return sv?['ok','Link '+sv+' reconhecido']:['bad','Usa um link https do transfer.it, WeTransfer ou Google Drive']; }
  function campoLink(tipo,i,val,rot,ph){ var r=validaLink(tipo,val||''); return '<div class="campo"><label class="l" for="'+tipo+'-'+i+'">'+rot+'</label><input class="input" id="'+tipo+'-'+i+'" data-lk="'+tipo+':'+i+'" value="'+esc(val||'')+'" inputmode="url" placeholder="'+ph+'"><span class="vl '+r[0]+'" data-vl="'+tipo+':'+i+'">'+r[1]+'</span></div>'; }
  // PDFs anexados: no protótipo ficam neste aparelho (IndexedDB); na versão real, no Supabase Storage
  function fiqIdb(){ return new Promise(function(res, rej){ var r = indexedDB.open('fiq-demo', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('pdfs'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function fiqIdbOp(modo, fn){ return fiqIdb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction('pdfs', modo), st = tx.objectStore('pdfs'), rq = fn(st); tx.oncomplete = function(){ res(rq && rq.result); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
  function pdfLer(k){ return fiqIdbOp('readonly', function(st){ return st.get(k); }); }
  function pdfGravar(k, v){ return fiqIdbOp('readwrite', function(st){ return st.put(v, k); }); }
  function pdfApagar(k){ return fiqIdbOp('readwrite', function(st){ return st.delete(k); }); }
  var ANABERTA={};
  // ===== Pontos a avaliar (carta/radar): 4 ofensivos + 4 defensivos, por posição =====
  var POS_ATR={
    'Defesa central':{of:['Receção orientada','Condução de bola','Diversidade de passe / verticalização','Afundar / criar distâncias'],df:['Controlo de profundidade','Duelos defensivos','Fecho de baliza','Equilíbrio defensivo']},
    'Lateral':{of:['Profundidade e cruzamento','Apoio interior','Condução','Ligação com o extremo'],df:['Duelos 1x1','Fecho ao 2.º poste','Cobertura ao central','Recuperação']},
    'Médio':{of:['Receção orientada','Passe a romper linhas','Rotação/orientação','Chegada à área'],df:['Pressão','Cobertura','Duelos','Equilíbrio']},

    'Avançado':{of:['Finalização','Desmarcação','Jogo de costas','Ataque à área'],df:['Pressão ao central','Orientar a saída','Duelos aéreos','Reação à perda']}
  };
  function posDe(c){ var pf=lerPerfil(c); return (pf&&pf.pos)||c.pos||'Médio'; }

  function atrDe(c){ return c.atr ? {of:c.atr.of.slice(),df:c.atr.df.slice()} : atrModelo(posDe(c)); }
  function atrLista(c){ var a=atrDe(c); return a.of.concat(a.df); }
  var ETIQUETAS=(function(){ var v={}; Object.keys(POS_ATR).forEach(function(p){ POS_ATR[p].of.concat(POS_ATR[p].df).forEach(function(e){ v[e]=1; }); }); return Object.keys(v); })();
  function notasCampo(c,a,i){
    var nomes=atrLista(c), mapa={}; (a.notas||[]).forEach(function(n){ mapa[n[0]]=n[1]; });
    function linha(n,k){ return '<label class="nt-row"><span>'+esc(n)+'</span><input class="input nt-in" type="number" inputmode="numeric" min="0" max="100" step="1" data-nota="'+i+'|'+k+'" value="'+(mapa[n]!=null?mapa[n]:'')+'" placeholder="0–100"></label>'; }
    return '<div class="nt-box"><div class="between"><span class="l" style="margin:0">Notas da carta (0–100) · as mesmas do relatório</span><button type="button" class="textlink" data-ir="sec-atr">Mudar os pontos</button></div>'+
      '<div class="nt-cols"><div><div class="nt-tit">Ofensivo</div>'+nomes.slice(0,4).map(function(n,k){return linha(n,k);}).join('')+'</div><div><div class="nt-tit">Defensivo</div>'+nomes.slice(4).map(function(n,k){return linha(n,k+4);}).join('')+'</div></div></div>';
  }
  function tamTxt(b){ b=+b||0; return b>=1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
  function pdfCampo(c,a,i){
    return '<div class="campo" id="pdfc-'+i+'"><span class="l">Relatório PDF · ficheiro anexado</span>'+
      (a.pdfNome
        ? '<div class="pdf-it"><span class="pdf-ic">PDF</span><span style="flex:1 1 140px;min-width:0"><strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.pdfNome)+'</strong><span class="sub" style="margin:0">'+tamTxt(a.pdfTam)+'</span></span><label class="btn ghost small" for="pf-'+i+'">Trocar</label><button class="btn ghost small" type="button" data-pdfrm="'+i+'">Tirar</button></div>'

  }
  function lerPS(){ try{ return JSON.parse(localStorage.getItem('fiq-demo-proxsessao')||'{}'); }catch(e){ return {}; } }
  function proxSessao(c){ return lerPS()[c.email.toLowerCase()]||''; }

    function anDe(a){ return {id: a.id, nome: a.nome || '', jogo: a.jogo || '', data: a.data_txt || '', estado: a.estado, nivel: a.nivel || '', preco: +a.preco || 0, pago: +a.pago || 0, pagoInfo: a.pago_info || 'Por pagar', yt: a.yt || '', dl: a.link_video || '', ate: a.links_ate || '', pdf: '', pdfNome: a.pdf_nome || '', pdfTam: a.pdf_tamanho || 0, pdfPath: a.pdf_path || '', notas: a.notas || [], momentos: a.momentos || [], avisado: (a.conteudo || {}).avisado || '', pedido: (a.conteudo || {}).pedido || null}; }
    function linhaCli(c){ return {id: c.id, email: String(c.email).toLowerCase(), telefone: c.tel || null, formato: c.formato, pack: c.pack, total: +c.total || 1, feitas: +c.feitas || 0, preco: +c.preco || 0, codigo: c.codigo || null, atr: c.atr || null, prox_sessao: proxSessao(c) || null, pos: c.pos || null, extra: {nome: c.nome || '', manter: c.manter || [], melhorar: c.melhorar || [], comp: c.comp || [], stats: c.stats || {}}}; }
    function linhaAn(c, a){ return {id: a.id, cliente_id: c.id, nome: a.nome || 'Sessão', jogo: a.jogo || null, data_txt: a.data || null, estado: a.estado || 'Recebido', nivel: a.nivel || null, preco: +a.preco || 0, pago: +a.pago || 0, pago_info: a.pagoInfo || 'Por pagar', yt: a.yt || null, link_video: a.dl || null, links_ate: a.ate || null, pdf_path: a.pdfPath || null, pdf_nome: a.pdfNome || null, pdf_tamanho: a.pdfTam || null, momentos: a.momentos || [], notas: a.notas || [], conteudo: Object.assign({}, a.pedido ? {pedido: a.pedido} : {}, a.avisado ? {avisado: a.avisado} : {})}; }
    function linhasPag(c){ return (c.pagamentos || []).map(function(p){ if (!p._data) p._data = hojeISO(); return {cliente_id: c.id, data: p._data, valor: +p.v || 0, metodo: p.m || null}; }); }
    function foto(c){ var g = {cli: JSON.stringify(linhaCli(c)), an: {}, pag: JSON.stringify(linhasPag(c))}; c.analises.forEach(function(a){ g.an[a.id] = JSON.stringify(linhaAn(c, a)); }); return g; }

    function carregarG(){
      return Promise.all([
        SB.from('clientes').select('*').order('criado_em', {ascending: false}),
        SB.from('perfis').select('cliente_id,dados'),
        SB.from('analises').select('*').order('criado_em', {ascending: false}),
        SB.from('pagamentos').select('*').order('data', {ascending: true}),
        SB.from('mensagens').select('*').order('criado_em', {ascending: true})
      ]).then(function(rs){
        rs.forEach(function(x){ if (x.error) throw x.error; });
        var cs = rs[0].data || [], pfs = rs[1].data || [], ans = rs[2].data || [], pgs = rs[3].data || [], ms = rs[4].data || [];
        var R = {'fiq-demo-links': '{}', 'fiq-demo-estado': '{}', 'fiq-demo-atr': '{}'}, dv = {}, ps = {};
        clientes.length = 0; conversas.length = 0;
        cs.forEach(function(r){
          var pf = (pfs.filter(function(p){ return p.cliente_id === r.id; })[0] || {}).dados;
          if (pf && !Object.keys(pf).length) pf = null;
          R['fiq-perfil:' + r.email] = pf ? JSON.stringify(pf) : null;
          var ex = r.extra || {};
          clientes.push({id: r.id, nome: ex.nome || '', ini: '', pos: r.pos || '', menor: false, email: r.email, tel: r.telefone || '', pack: r.pack, formato: r.formato, feitas: r.feitas, total: r.total, preco: +r.preco || 0, codigo: r.codigo || '', atr: r.atr || null, ativa: !!r.user_id,
            pagamentos: pgs.filter(function(p){ return p.cliente_id === r.id; }).map(function(p){ return {d: dCurta(p.data), _data: p.data, v: +p.valor || 0, m: p.metodo || ''}; }),
            acesso: r.user_id ? 'Conta ativada' : 'Ainda não ativou a conta · código ' + (r.codigo || '—'),
            recPedido: r.rec_pedido_em || null, recCodigo: r.rec_codigo || '', recAte: r.rec_ate || null,
            perfil: null, analises: ans.filter(function(a){ return a.cliente_id === r.id; }).map(anDe),
            manter: ex.manter || [], melhorar: ex.melhorar || [], comp: ex.comp || [], stats: ex.stats || {passes: '', duelos: '', rec: '', dec: ''}});
          if (r.prox_sessao) ps[r.email.toLowerCase()] = r.prox_sessao;
          var l = ms.filter(function(m){ return m.cliente_id === r.id; }).map(msgDe);
          if (l.length) dv[r.id] = l;
        });
        R['fiq-demo-duvidas'] = JSON.stringify(dv);
        R['fiq-demo-proxsessao'] = JSON.stringify(ps);
        REAL = R;
        guardados = {}; clientes.forEach(function(c){ guardados[c.id] = foto(c); });
      });
    }
    function erroGravar(e){
      console.error(e);
      toast(e && e.code === '23505' ? 'Já existe um cliente com este email.' : 'Não foi possível guardar no servidor. Confirma a rede e tenta outra vez.');
    }
    function gravarCliente(c){
      var g = guardados[c.id] || (guardados[c.id] = {cli: null, an: {}, pag: '[]'});
      var lc = JSON.stringify(linhaCli(c)), p = Promise.resolve(true);
      if (lc !== g.cli) p = SB.from('clientes').upsert(JSON.parse(lc)).then(function(r){ if (r.error){ erroGravar(r.error); return false; } g.cli = lc; return true; });
      return p.then(function(ok){
        if (!ok) return;
        var tarefas = [];
        c.analises.forEach(function(a){
          var la = JSON.stringify(linhaAn(c, a));
          if (la !== g.an[a.id]) tarefas.push(SB.from('analises').upsert(JSON.parse(la)).then(function(r){ if (r.error) erroGravar(r.error); else g.an[a.id] = la; }));
        });
        var lp = JSON.stringify(linhasPag(c));
        if (lp !== g.pag) tarefas.push(SB.from('pagamentos').delete().eq('cliente_id', c.id).then(function(r){
          if (r.error) throw r.error;
          var rows = JSON.parse(lp); return rows.length ? SB.from('pagamentos').insert(rows) : {error: null};
        }).then(function(r){ if (r.error) throw r.error; g.pag = lp; }).catch(erroGravar));
        return Promise.all(tarefas);
      });
    }
    window.__fiqGravar = function(){
      if (!REAL) return;
      clearTimeout(tGrav);
      tGrav = setTimeout(function(){ cadeia = cadeia.then(function(){ return Promise.all(clientes.map(gravarCliente)); }).catch(erroGravar); }, 400);
    };
    function enviarRespostas(v){
      var o = {}; try { o = JSON.parse(v || '{}'); } catch(e){}
      Object.keys(o).forEach(function(cid){
        (o[cid] || []).forEach(function(m){
          if (m.id || m._env || m.de !== 'eu') return;
          m._env = 1;
          SB.from('mensagens').insert({cliente_id: cid, autor: 'analista', texto: m.t, sobre: 'Analista'}).select('id').single().then(function(r){
            if (r.error){ toast('A resposta não foi enviada. Confirma a rede e tenta outra vez.'); return; }
            m.id = r.data.id; REAL['fiq-demo-duvidas'] = JSON.stringify(o);
            var cc = cli(cid); if (cc) window.__fiqAvisar(cc, 'Resposta do analista', String(m.t).slice(0, 110), './#duvidas').catch(function(){});
          });
        });
      });
      REAL['fiq-demo-duvidas'] = JSON.stringify(o);
    }
    var podePushG = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    var iosG = /iphone|ipad|ipod/i.test(navigator.userAgent), standaloneG = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    function b64uG(t){ var p = '='.repeat((4 - t.length % 4) % 4), b = atob((t + p).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
    var chaveG = null;
    function lerChaveG(){ if (chaveG) return Promise.resolve(chaveG); return fetch(CFG.url + '/functions/v1/notificar', {headers: {apikey: CFG.key, Authorization: 'Bearer ' + CFG.key}}).then(function(r){ return r.json(); }).then(function(j){ if (!j.publicKey) throw new Error('sem chave'); chaveG = j.publicKey; return chaveG; }); }
    function subG(){
      return lerChaveG().then(function(k){ return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription().then(function(x){
        var igual = false; try { var a = new Uint8Array(x.options.applicationServerKey), b = b64uG(k); igual = a.length === b.length && a.every(function(v, i){ return v === b[i]; }); } catch(e){}
        if (x && igual) return x;
        return (x ? x.unsubscribe() : Promise.resolve()).then(function(){ return reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uG(k)}); });
      }); }); }).then(function(sub){ var j = sub.toJSON(); return SB.from('push_gestor').upsert({endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth}).then(function(r){ if (r.error) throw r.error; }); });
    }
    window.__fiqAvisosG = function(){
      if (iosG && !standaloneG) return '<div class="card" style="border-color:var(--cobre)"><strong>Avisos de pedidos e mensagens</strong><div class="sub">No iPhone, instala primeiro a app no ecrã principal (Partilhar → Adicionar ao ecrã principal).</div></div>';
      if (!podePushG || Notification.permission !== 'default') return '';
      return '<div class="card between" style="border-color:var(--cobre);gap:12px"><span style="min-width:0"><strong style="display:block">Recebe avisos neste aparelho</strong><span class="sub">Quando um jogador pedir uma análise ou te mandar uma mensagem.</span></span><button class="btn cobre small" type="button" data-acao="avisos-g">Ligar</button></div>';
    };
    window.__fiqLigarAvisosG = function(){
      if (!podePushG){ toast('Este navegador não recebe avisos.'); return; }
      Notification.requestPermission().then(function(p){
        if (p !== 'granted'){ toast('Avisos desligados neste aparelho.'); render(); return; }
        return subG().then(function(){ toast('Avisos ligados neste aparelho.'); render(); });
      }).catch(function(){ toast('Não foi possível ligar os avisos. Tenta outra vez.'); });
    };
    function sincronizarAvisosG(){ if (podePushG && Notification.permission === 'granted') subG().catch(function(){}); }
    window.__fiqAvisar = function(c, titulo, texto, abrir){
      return SB.functions.invoke('notificar', {body: {cliente_id: c.id, titulo: titulo, texto: texto, abrir: abrir}}).then(function(r){ if (r.error) throw r.error; return r.data; });
    };
    // PDF do relatório: fica no Storage privado (relatorios/<cliente>/<análise>.pdf)
    window.__fiqPdfUp = function(c, a, f){
      var path = c.id + '/' + a.id + '.pdf';
      return SB.storage.from('relatorios').upload(path, f, {upsert: true, contentType: 'application/pdf'}).then(function(r){ if (r.error) throw r.error; a.pdfPath = path; });
    };
    window.__fiqRecCodigo = function(c){
      var cod = window.__fiqCodigo(), ate = new Date(Date.now() + 864e5).toISOString();
      return SB.from('clientes').update({rec_codigo: cod, rec_ate: ate, rec_pedido_em: null}).eq('id', c.id).then(function(r){
        if (r.error) throw r.error; c.recCodigo = cod; c.recAte = ate; c.recPedido = null;
      });
    };
    window.__fiqPdfRm = function(c, a){
      if (a.pdfPath) SB.storage.from('relatorios').remove([a.pdfPath]).then(function(){});
      a.pdfPath = '';
    };
    // mensagens novas e perfis chegam sem recarregar
    function recarregarMsgs(){
      SB.from('mensagens').select('*').order('criado_em', {ascending: true}).then(function(r){
        if (r.error || !REAL) return;
        var dv = {}; (r.data || []).forEach(function(m){ (dv[m.cliente_id] = dv[m.cliente_id] || []).push(msgDe(m)); });
        var novo = JSON.stringify(dv); if (novo === REAL['fiq-demo-duvidas']) return;
        REAL['fiq-demo-duvidas'] = novo;
        window.dispatchEvent(new StorageEvent('storage', {key: 'fiq-demo-duvidas'}));
      });
    }
    function recarregarPerfis(){
      SB.from('perfis').select('cliente_id,dados').then(function(r){
        if (r.error || !REAL) return;
        (r.data || []).forEach(function(p){ var c = cli(p.cliente_id); if (c) REAL['fiq-perfil:' + c.email] = p.dados && Object.keys(p.dados).length ? JSON.stringify(p.dados) : null; });
        var h = location.hash; if (h === '#painel' || h === '#clientes' || h === '' || h === '#') render();
      });
    }
    function ligarTempoReal(){
      if (canal) SB.removeChannel(canal);
      canal = SB.channel('fiq-gestao')
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'mensagens'}, recarregarMsgs)
        .on('postgres_changes', {event: '*', schema: 'public', table: 'perfis'}, recarregarPerfis)
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'analises'}, function(p){
          var r = p.new || {}; if (cli(r.cliente_id) && cli(r.cliente_id).analises.some(function(x){ return x.id === r.id; })) return;
          carregarG().then(function(){ var c = cli(r.cliente_id); toast('Novo pedido de análise' + (c ? ' de ' + nomeDe(c) : '') + '.'); render(); });
        })
        .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'clientes'}, function(p){
          var r = p.new || {}, c = cli(r.id); if (!c) return;
          var antes = JSON.stringify([c.recPedido, c.recCodigo, c.ativa]);
          c.recPedido = r.rec_pedido_em || null; c.recCodigo = r.rec_codigo || ''; c.recAte = r.rec_ate || null; c.ativa = !!r.user_id;
          if (c.ativa) c.acesso = 'Conta ativada';
          if (JSON.stringify([c.recPedido, c.recCodigo, c.ativa]) === antes) return;
          var h = location.hash; if (h === '#painel' || h === '#clientes' || h === '' || h === '#' || h === '#cliente-' + c.id) render();
        })
        .subscribe();
    }
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && REAL){ recarregarMsgs(); recarregarPerfis(); } });
    function entrar(){
      return carregarG().then(function(){ logado = true; ligarTempoReal(); sincronizarAvisosG(); if (!location.hash || location.hash === '#login') location.hash = 'painel'; render(); });
    }
    window.__fiqGLogin = function(em, pw){
      em = String(em || '').trim().toLowerCase();
      if (em !== GESTOR){ toast('Esta entrada é só para a conta de gestão.'); return; }
      if (!pw){ toast('Escreve a palavra-passe.'); return; }
      SB.auth.signInWithPassword({email: em, password: pw}).then(function(r){
        if (r.error){ toast(/invalid/i.test(r.error.message) ? 'Email ou palavra-passe errados.' : SEM_REDE); return; }
        entrar().catch(function(e){ console.error(e); toast('Entraste, mas não foi possível carregar os clientes. Tenta outra vez.'); });
      });
    };
    window.__fiqGSair = function(){
      if (canal){ SB.removeChannel(canal); canal = null; }
      REAL = null; logado = false;
      return SB.auth.signOut();
    };
    window.__fiqGArranque = function(){
      V.innerHTML = '<p class="sub" style="margin:auto;text-align:center">A carregar…</p>';
      SB.auth.getSession().then(function(r){
        var s = r.data && r.data.session, em = s ? String(s.user.email || '').toLowerCase() : '';
        if (s && em === GESTOR) return entrar();
        logado = false; location.hash = 'login'; render();
      }).catch(function(){ logado = false; location.hash = 'login'; render(); });
    };
  })();
  if (window.__fiqGArranque) window.__fiqGArranque(); else render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
