<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/playfair-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:600;font-display:swap;src:url(assets/fonts/playfair-display-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/mulish-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/mulish-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Mulish;font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/mulish-latin-800-normal.woff2) format('woff2')}

<style>
/* Layout: app de gestão do analista, um telemóvel ao centro; tema claro (beje + cobre) para nunca se confundir com a app do cliente; vistas trocadas por #hash. */
:root{
  --bg:#D9D0C1; --app:#E8E0D3; --card:#F6F2E9; --line:#D3C8B6; --line2:#C2B6A2;
  --fg:#1B1815; --muted:#4F473E; --dim:#6E6457;
  --cobre:#8A4F24; --cobre2:#B5703E; --ink:#1B1815; --gold:#C9A453; --gold2:#E2C27A;
  --on-ink:#F2EEE2; --on-ink-muted:#CFC4B3; --field:#FFFFFF; --soft:var(--soft); --nav:#EFE8DC;
  --ok:#2F6B45; --warn:#9A5B12; --bad:#A33A2C; --ok-bg:#DCEADF; --warn-bg:#F3E2C6; --bad-bg:#F3D6D0; --on-cobre:#FFFFFF; --on-bad:#FFFFFF;
  --display:'Playfair Display', Georgia, serif; --body:Mulish, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E0D0C; --app:#151311; --card:#1E1B18; --line:#2E2A25; --line2:#3E3933;
  --fg:#F2EEE2; --muted:#CFC4B3; --dim:#A79C8C;
  --cobre:#E0A372; --cobre2:#E8B48A; --ink:#E8E0D3; --gold2:#7A4520;
  --on-ink:#1B1815; --on-ink-muted:#4F473E; --field:#25211D; --soft:#2A2622; --nav:#12100F;
  --ok:#7FC79A; --warn:#E5B46A; --bad:#F0A296; --ok-bg:#1C2E22; --warn-bg:#33270F; --bad-bg:#3A1E19; --on-cobre:#1B1815; --on-bad:#1B1815;
  color-scheme:dark;
}
#vista,.card,nav.tabs,.phone{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--cobre)}
:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
[hidden]{display:none!important}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100%;height:100%;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:600px) and (max-width:899px){
  .stage{padding-block:32px}
  .phone{min-height:860px;height:860px;border-radius:40px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(60,40,20,.35),0 0 0 8px #2A2723}
}
#vista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:20px 24px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));animation:entra .3s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.marca .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
.marca .em span{color:var(--cobre2)}
.wm{font-family:var(--display);font-weight:700;letter-spacing:0;white-space:nowrap}
.wm b{font-weight:700;color:#A98638}
:root[data-theme="dark"] .wm b{color:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wm b{color:var(--gold)} }
.em-img{width:34px;height:34px;border-radius:17px;display:block;flex-shrink:0}
.tag{font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:1.6px;background:var(--ink);color:var(--gold2);border-radius:99px;padding:4px 8px;text-transform:uppercase}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--cobre);text-transform:uppercase}
h1{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--cobre);font-variant-numeric:lining-nums}
h2{margin:0;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:block;color:var(--fg);text-decoration:none}
.dark{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:16px;display:block;text-decoration:none}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pz-tab{display:grid;gap:6px;margin:12px 0}
.pz-h,.pz-r{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.pz-h span{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.pz-r>span{font-weight:700;font-size:13.5px}
.pz-in{position:relative;display:block}.pz-in input{width:100%;height:42px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card);color:var(--fg);font:800 15px var(--body,inherit);padding:0 26px 0 10px;text-align:right}
.pz-in input::placeholder{color:var(--dim);opacity:.6;font-weight:600}.pz-in input:focus{outline:2px solid var(--gold);outline-offset:1px}
.pz-in i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--dim);font-size:13px}
.ped-g{display:flex;flex-direction:column;gap:10px}
.ped-g .pg-top{display:flex;gap:12px;align-items:flex-start}
.ped-g .pg-ic{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#111;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.ped-g .nm{font-weight:800}.ped-g .ds{font-size:12px;color:var(--muted);margin-top:2px}
.ped-g .pg-v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}.ped-g .pg-v b{font-size:17px;font-variant-numeric:tabular-nums}
.pe{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pe-ped{background:var(--line);color:var(--muted)}.pe-jp{background:rgba(224,160,59,.18);color:#C7871F}.pe-pag{background:rgba(93,176,126,.16);color:#3E9A63}.pe-pre{background:rgba(201,164,83,.2);color:var(--gold2)}.pe-ent{background:rgba(93,176,126,.22);color:#3E9A63}.pe-can{background:var(--line);color:var(--muted);text-decoration:line-through}
.ped-g .pg-nota{font-size:13px;color:var(--muted);font-style:italic}
.ped-g .pg-ac{justify-content:flex-end}
.loja-av{display:flex;align-items:center;gap:8px;border:1.5px solid var(--gold)!important}.loja-av b{font-size:20px}.loja-av span{margin-left:auto;font-weight:800}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.dark.kpi span{color:var(--on-ink-muted)}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-ink{background:var(--ink);color:var(--gold2)}
.p-soft{background:var(--soft);color:var(--muted)}
.btn{min-height:48px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;border:none;width:100%;padding:0 16px}
.btn.ink{background:var(--ink);color:var(--gold2)}
.btn.cobre{background:var(--cobre);color:var(--on-cobre)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{min-height:40px;width:auto;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;cursor:pointer;position:relative;flex-shrink:0}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.input{color:var(--fg);min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--field);padding:0 14px;width:100%}
textarea.input{padding:12px 14px;resize:none;line-height:1.4}
label.l{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.6px}
.campo{display:flex;flex-direction:column;gap:6px}
.lista{display:flex;flex-direction:column;gap:8px}
.cli{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden;width:42px;height:42px;border-radius:21px;background:var(--ink);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.cli .nm{font-weight:800}
.cli .ds{font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:9px;height:9px;border-radius:5px;background:var(--bad);flex-shrink:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold2)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--field);font-size:20px;font-weight:800;cursor:pointer}
.step b{font-family:var(--display);font-size:26px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.an{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.up{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px dashed var(--line2);cursor:pointer;font-size:13px;font-weight:700;background:var(--card)}
.up.feito{border-style:solid;border-color:var(--ok);color:var(--ok)}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.it{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;border-radius:10px;background:var(--field);border:1px solid var(--line);font-size:14px}
.it span{flex:1}
.it button{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--dim);font-size:18px}
.msg{max-width:86%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45}
.msg small{display:block;font-size:11px;margin-top:6px;opacity:.7}
.msg .sb{display:block;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.msg.cli2{align-self:flex-start;background:var(--field);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.eu{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.lock{font-size:13px;color:var(--dim);border:1px dashed var(--line2);border-radius:12px;padding:12px}
nav.tabs{flex-shrink:0;border-top:1px solid var(--line2);background:var(--nav);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:max(8px, env(safe-area-inset-bottom,0px))}
nav.tabs a{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--dim);font-size:11px;font-weight:800;position:relative}
nav.tabs a[aria-current="page"]{color:var(--cobre)}
nav.tabs .badge{top:6px;right:calc(50% - 22px)}
.push{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(27,24,21,.96);color:#F2EEE2;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9;cursor:pointer;animation:desce .4s cubic-bezier(.2,1.3,.4,1);border:none;text-align:left;width:auto;font:inherit}
@keyframes desce{from{transform:translateY(-120%)}to{transform:none}}
.push .ic{width:36px;height:36px;border-radius:9px;background:var(--ink);border:1px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0}
.push small{display:block;font-size:11px;color:#CFC4B3}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--gold2);font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;z-index:8;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.side-brand{display:none}
@media (min-width:900px){
  .stage{height:100%;padding:0}
  .phone{max-width:none;height:100%;min-height:0;border-radius:0;border:none;box-shadow:none;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-top:0}
  #vista{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;align-items:start;gap:16px;padding:40px max(48px, calc((100% - 1120px) / 2)) 48px}
  .phone:has(#tabs:not([hidden])) #vista{grid-column:2}
  #vista > *{grid-column:1 / -1}
  #vista > .card{grid-column:auto}
  .phone:has(#tabs:not([hidden])) #vista > .top .marca{display:none}
  #vista > .top{justify-content:flex-end}
  #vista:has(#g-login) > .top{justify-content:space-between}
  #vista > .top > .iconbtn{margin-left:auto}
  #vista > .btn.small{justify-self:start}
  nav.tabs{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:4px;border-top:none;border-right:1px solid var(--line2);padding:28px 14px}
  nav.tabs a{flex-direction:row;justify-content:flex-start;height:48px;padding:0 14px;gap:12px;font-size:14px;border-radius:12px}
  nav.tabs a:hover{background:var(--soft);color:var(--fg)}
  nav.tabs a[aria-current="page"]{background:var(--card)}
  nav.tabs .badge{position:static;margin-left:auto}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--display);font-weight:700;font-size:19px}
  .side-brand .em{width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
  .side-brand .em span{color:var(--cobre2)}
  h1{font-size:34px}
  #vista .grid2{grid-template-columns:repeat(4,minmax(0,1fr))}
  #vista .card .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #lista-cli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .msg{max-width:min(86%,640px)}
  .push{left:auto;right:24px;width:380px}
  .toast{bottom:32px}
  #vista:has(#g-login){grid-template-columns:minmax(0,440px);justify-content:center;align-content:center}
}
.vl{font-size:12px;font-weight:700;min-height:16px}
.vl.ok{color:var(--ok)}
.vl.ok::before{content:"✓ "}
.vl.bad{color:var(--bad)}
.vl.bad::before{content:"✕ "}
.dica{font-size:13px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dica summary{font-weight:800;cursor:pointer;min-height:28px;display:flex;align-items:center}
.dica ol{margin:6px 0 0;padding-left:20px;line-height:1.6}
.tema-btn .ico-sol{display:none}.tema-btn.escuro .ico-sol{display:block}.tema-btn.escuro .ico-lua{display:none}
.nav-tema{display:none}.nav-sair{display:none}@media (min-width:900px){.nav-sair{display:flex;align-items:center;gap:12px;order:100;height:48px;padding:0 14px;border:none;border-radius:12px;background:none;color:var(--dim);font:800 14px var(--body);cursor:pointer;text-align:left}.nav-sair:hover,.nav-sair:focus-visible{background:rgba(192,80,63,.12);color:#C0503F}}.btn-sair{display:inline-flex;align-items:center;justify-content:center;gap:10px}@media (min-width:900px){.so-tm{display:none!important}}
.resumo{display:flex;flex-wrap:wrap;gap:6px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;position:sticky;top:-20px;z-index:2;background:var(--app);margin:0 -4px;padding:6px 4px}
.secnav button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font:800 12px var(--body);cursor:pointer;white-space:nowrap}
.secnav button:hover{border-color:var(--cobre)}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:60px}
.sep{height:1px;background:var(--line);margin:4px 0}
.pfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pfg div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pfg span{display:block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.pfg b{display:block;font-size:15px;margin-top:2px}
.pfg .larga{grid-column:1 / -1}
details.an{padding:0;gap:0}
details.an > summary{list-style:none;cursor:pointer;padding:14px;min-height:48px}
details.an > summary::-webkit-details-marker{display:none}
details.an[open] > summary{border-bottom:1px solid var(--line)}
.an-corpo{display:flex;flex-direction:column;gap:10px;padding:14px}
.atv-ic{display:inline-flex;gap:3px;align-items:center;margin-right:2px}.atv-ic .ai{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--dim,#8F897C);opacity:.55}.atv-ic .ai.on{color:#B8913F;background:rgba(201,164,83,.16);opacity:1}
.atv-box{border:1px solid rgba(201,164,83,.35);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:rgba(201,164,83,.05)}
.atv-hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.atv-hd b{font-size:14px}.atv-hd span{font-size:12px;color:var(--dim,#8F897C)}
.atv-l{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}.atv-st{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--dim,#8F897C);background:rgba(143,137,124,.15)}.atv-st.on{color:#B8913F;background:rgba(201,164,83,.2)}
.atv-tx{min-width:0;flex:1}.atv-bar{display:block;height:5px;border-radius:9px;background:rgba(143,137,124,.25);margin-top:6px;overflow:hidden}.atv-bar i{display:block;height:100%;background:#C9A453;border-radius:9px}
.atv-mo{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:12.5px;color:var(--dim,#8F897C)}.atv-mo .on{color:inherit}.atv-mo span{color:var(--dim,#8F897C)}.atv-mo span.on{color:#B8913F}
.atv-nota{margin:2px 0 0;font-size:11.5px;color:var(--dim,#8F897C)}
@media (max-width:520px){.atv-ic .ai{width:20px;height:20px}.atv-ic{gap:2px}details.an>summary.between{flex-wrap:wrap;row-gap:8px}details.an>summary.between>.an-dir{width:100%;justify-content:flex-end}}
.an-env{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;flex-shrink:0}.an-env.ok{background:rgba(143,137,124,.18);color:var(--dim,#8F897C)}.an-env.vi{background:rgba(201,164,83,.18);color:#B8913F}.an-env.no{background:rgba(192,80,63,.14);color:#C0503F}.an-dir{display:flex;align-items:center;gap:6px;flex-shrink:0}.an-lixo{display:grid;place-items:center;width:40px;height:40px;margin:-6px -6px -6px 0;border:0;border-radius:10px;background:transparent;color:var(--dim,#8F897C);cursor:pointer}.an-lixo:hover,.an-lixo:focus-visible{color:#C0503F;background:rgba(192,80,63,.12)}.del-conf{display:grid;gap:10px;border:1.5px solid #C0503F;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45}.btn.del-sim{background:#C0503F;border:1.5px solid #C0503F;color:#fff}.gd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}.gd-row .btn{width:100%;white-space:nowrap}@media (max-width:440px){.gd-row .gd-cli{display:none}}
.pdf-it,.pdf-up{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2,#CFC4B3);border-radius:12px;flex-wrap:wrap}
.pdf-up{border-style:dashed;cursor:pointer}

.pdf-up:hover{border-color:var(--cobre,#8A4F24)}
.pdf-ic{width:38px;height:44px;border-radius:6px;background:#8A4F24;color:#fff;font:800 11px/44px Mulish,sans-serif;text-align:center;flex:none;letter-spacing:.5px}
.nt-box{border:1px solid var(--line2,#CFC4B3);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

.nt-aviso{background:rgba(201,164,83,.14);border-radius:12px;gap:10px;flex-wrap:wrap}

.atr-row .atr-val{text-align:center;font-weight:800}

.atr-cols .input.foco{outline:2px solid var(--cobre,#8A4F24)}

.btn.whats{background:#1F7A4D;color:#fff}

.ses-tab{display:flex;flex-direction:column;gap:6px}

.ses-row:hover{border-color:var(--cobre)}
.ses-n{flex:1;min-width:140px;font-weight:800;font-size:14px}.ses-n small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.ses-v{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.note{font-size:12px;color:var(--dim);line-height:1.5}
.demo{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--dim)}

/* ===== fundo "Holofote dourado" (escolhido a 17/11): claro = papel beje, escuro = preto ===== */

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .phone{background:radial-gradient(circle at 88% -12%, rgba(201,164,83,.30), transparent 48%), radial-gradient(circle at -5% 115%, rgba(138,79,36,.28), transparent 45%), #0D0C0B} }
:root[data-theme="dark"] .phone{background:radial-gradient(circle at 88% -12%, rgba(201,164,83,.30), transparent 48%), radial-gradient(circle at -5% 115%, rgba(138,79,36,.28), transparent 45%), #0D0C0B}

          if (k >= n) return apiV('up/end', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: ini.key, uploadId: ini.uploadId, parts: partes})});
          var pedaco = file.slice(k * PARTE, Math.min(file.size, (k + 1) * PARTE)), num = k + 1, tentativas = 0;
          function envia(){
            return apiV('up/part?key=' + encodeURIComponent(ini.key) + '&uploadId=' + encodeURIComponent(ini.uploadId) + '&n=' + num, {method: 'PUT', body: pedaco})
              .catch(function(e){ if (++tentativas < 3) return new Promise(function(ok){ setTimeout(ok, 1500 * tentativas); }).then(envia); throw e; });
          }
          return envia().then(function(p){ partes.push({partNumber: p.partNumber, etag: p.etag}); k++; prog(Math.round(k / n * 100)); return proxima(); });
        }
        prog(1); return proxima();
      }).then(function(fim){
        var dados = {video_key: fim.key, video_nome: file.name, video_tamanho: file.size};
        return SB.from('analises').update(dados).eq('id', a.id).then(function(r){ if (r.error) throw r.error;
          a.vk = fim.key; a.vnome = file.name; a.vtam = file.size; setTimeout(lerUso, 1500); CAPA_VISTA[fim.key] = 1;
          capaDoVideo(file).then(function(b){ return enviaCapa(fim.key, b); });
          if (antigo && antigo !== fim.key) apiV('del', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: antigo})}).catch(function(){});
        });
      }).catch(function(e){
        if (ini) apiV('up/abort', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: ini.key, uploadId: ini.uploadId})}).catch(function(){});
        throw e;
      });
    };
    window.__fiqVideoRm = function(a){
      var k = a.vk; if (!k) return Promise.resolve();
      return SB.from('analises').update({video_key: null, video_nome: null, video_tamanho: null}).eq('id', a.id).then(function(r){ if (r.error) throw r.error;
        a.vk = ''; a.vnome = ''; a.vtam = 0; setTimeout(lerUso, 1500);
        return apiV('del', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: k})}).catch(function(){});
      });
    };
    var USO = null;
    function lerUso(){ return apiV('uso').then(function(u){ USO = u; document.querySelectorAll('.vd-uso').forEach(function(el){ el.textContent = window.__fiqVideoUso(); }); }).catch(function(){}); }
    window.__fiqVideoUso = function(){ if (!USO) return 'Espaço dos vídeos: a verificar…'; var gb = function(b){ return (b / 1073741824).toFixed(1).replace('.', ','); }; return 'Espaço dos vídeos: ' + gb(USO.usado) + ' GB de ' + gb(USO.limite) + ' GB grátis'; };
    setTimeout(lerUso, 2500);
    window.__fiqVideoUrl = function(a){ return apiV('token', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({analise_id: a.id})}).then(function(r){ return r.url; }); };
    window.__fiqApagarAn = function(c, a){
      if (a.pdfPath) SB.storage.from('relatorios').remove([a.pdfPath]).then(function(){});
      if (a.vk) apiV('del', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: a.vk})}).catch(function(){});
      var g = guardados[c.id]; if (g) delete g.an[a.id];
      return SB.from('analises').delete().eq('id', a.id).then(function(r){ if (r.error) throw r.error; });
    };
    window.__fiqPdfRm = function(c, a){
      if (a.pdfPath) SB.storage.from('relatorios').remove([a.pdfPath]).then(function(){});
      a.pdfPath = '';
    };
    // mensagens novas e perfis chegam sem recarregar
    function recarregarMsgs(){
      SB.from('mensagens').select('*').order('criado_em', {ascending: true}).then(function(r){
        if (r.error || !REAL) return;
        var dv = {}; (r.data || []).forEach(function(m){ (dv[m.cliente_id] = dv[m.cliente_id] || []).push(msgDe(m)); });
        var novo = JSON.stringify(dv); if (novo === REAL['fiq-demo-duvidas']) return;
        REAL['fiq-demo-duvidas'] = novo;
        window.dispatchEvent(new StorageEvent('storage', {key: 'fiq-demo-duvidas'}));
      });
    }
    function recarregarPerfis(){
      SB.from('perfis').select('cliente_id,dados').then(function(r){
        if (r.error || !REAL) return;
        (r.data || []).forEach(function(p){ var c = cli(p.cliente_id); if (c) REAL['fiq-perfil:' + c.email] = p.dados && Object.keys(p.dados).length ? JSON.stringify(p.dados) : null; });
        var h = location.hash; if (h === '#painel' || h === '#clientes' || h === '' || h === '#') render();
      });
    }
    function ligarTempoReal(){
      if (canal) SB.removeChannel(canal);
      canal = SB.channel('fiq-gestao')
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'mensagens'}, recarregarMsgs)
        .on('postgres_changes', {event: '*', schema: 'public', table: 'perfis'}, recarregarPerfis)
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'analises'}, function(p){
          var r = p.new || {}; if (cli(r.cliente_id) && cli(r.cliente_id).analises.some(function(x){ return x.id === r.id; })) return;
          carregarG().then(function(){ var c = cli(r.cliente_id); toast('Novo pedido de análise' + (c ? ' de ' + nomeDe(c) : '') + '.'); render(); });
        })
        .on('postgres_changes', {event: '*', schema: 'public', table: 'pedidos'}, function(p){
          var r = p.new || {}, novo = p.eventType === 'INSERT', pagou = p.eventType === 'UPDATE' && r.estado === 'jp';
          carregarPedidos().then(function(){
            var c = cli(r.cliente_id), n = c ? nomeDe(c) : 'Um jogador';
            if (novo) toast('Novo pedido na loja: ' + n + ' · ' + (r.produto || '') + '.');
            else if (pagou) toast(n + ' diz que já pagou o pedido ' + (r.ref || '') + '.');
            render();
          });
        })
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'atividade'}, function(p){
          if (window.__fiqAtivAdd) window.__fiqAtivAdd(p.new || {});
        })
        .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'analises'}, function(p){
          var r = p.new || {}, c = cli(r.cliente_id); if (!c) return;
          var a = c.analises.filter(function(x){ return x.id === r.id; })[0]; if (!a) return;
          var novaVista = r.vista_em && !a.vista;
          if (r.avisado_em && !a.avisado) a.avisado = r.avisado_em;
          if (r.vista_em) a.vista = r.vista_em;
          window.__fiqAtualizaSelo(a);
          if (novaVista) toast(nomeDe(c) + ' viu a análise ' + (a.jogo || a.nome || '') + '.');
        })
        .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'clientes'}, function(p){
          var r = p.new || {}, c = cli(r.id); if (!c) return;
          var antes = JSON.stringify([c.recPedido, c.recCodigo, c.ativa]);
          c.recPedido = r.rec_pedido_em || null; c.recCodigo = r.rec_codigo || ''; c.recAte = r.rec_ate || null; c.ativa = !!r.user_id;
          if (c.ativa) c.acesso = 'Conta ativada';
          if (JSON.stringify([c.recPedido, c.recCodigo, c.ativa]) === antes) return;
          var h = location.hash; if (h === '#painel' || h === '#clientes' || h === '' || h === '#' || h === '#cliente-' + c.id) render();
        })
        .subscribe();
    }
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && REAL){ recarregarMsgs(); recarregarPerfis(); } });
    function entrar(){
      return carregarG().then(function(){ logado = true; ligarTempoReal(); sincronizarAvisosG(); if (!location.hash || location.hash === '#login') location.hash = 'painel'; render(); });
    }
    window.__fiqGLogin = function(em, pw){
      em = String(em || '').trim().toLowerCase();
      if (em !== GESTOR){ toast('Esta entrada é só para a conta de gestão.'); return; }
      if (!pw){ toast('Escreve a palavra-passe.'); return; }
      SB.auth.signInWithPassword({email: em, password: pw}).then(function(r){
        if (r.error){ toast(/invalid/i.test(r.error.message) ? 'Email ou palavra-passe errados.' : SEM_REDE); return; }
        entrar().catch(function(e){ console.error(e); toast('Entraste, mas não foi possível carregar os clientes. Tenta outra vez.'); });
      });
    };
    window.__fiqGSair = function(){
      if (canal){ SB.removeChannel(canal); canal = null; }
      REAL = null; logado = false;
      // termina a sessão neste aparelho mesmo sem rede (nunca fica preso)
      function limpa(){ try { Object.keys(localStorage).forEach(function(k){ if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); }); } catch(e){} }
      var feito = SB.auth.signOut({scope: 'local'}).catch(function(){});
      var limite = new Promise(function(r){ setTimeout(r, 2500); });
      return Promise.race([feito, limite]).then(limpa, limpa);
    };
    window.__fiqGArranque = function(){
      V.innerHTML = '<p class="sub" style="margin:auto;text-align:center">A carregar…</p>';
      SB.auth.getSession().then(function(r){
        var s = r.data && r.data.session, em = s ? String(s.user.email || '').toLowerCase() : '';
        if (s && em === GESTOR) return entrar();
        logado = false; location.hash = 'login'; render();
      }).catch(function(){ logado = false; location.hash = 'login'; render(); });
    };
  })();
  if (window.__fiqGArranque) window.__fiqGArranque(); else render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
